[package]
name = "lc-input"
version = "0.1.0"
edition = "2021"
description = "Resenha: injeta mouse e teclado do controle remoto (Windows). Recebe comandos do app desktop pela entrada padrão."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
