[package]
name = "lc-stream"
version = "0.1.0"
edition = "2021"
description = "Resenha: transmissão de tela nativa (WGC sem limite de fps -> H.264 na placa de vídeo -> SRTP para o SFU)."
publish = false

[[bin]]
name = "lc-stream"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D10",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  # captura com escolha de método (capture.rs): DXGI, recorte de janela, tela cheia, DPI, versão do Windows, timer de 1 ms
  "Win32_Media",
  "Win32_Graphics_Dwm",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
# só na prova de conceito da captura DXGI (cargo build --features poc); o build normal não usa
windows-capture = { version = "=2.0.1", optional = true }

[features]
# PoC WGC x DXGI (docs/CAPTURA-WGC-DXGI.md): lc-stream --poc-captura. Fora do instalador.
poc = ["dep:windows-capture", "windows/Win32_UI_WindowsAndMessaging", "windows/Win32_Graphics_Dwm", "windows/Win32_UI_HiDpi",
  "windows/Win32_System_LibraryLoader", "windows/Win32_Security", "windows/Win32_System_Registry", "windows/Win32_UI_Shell",
  "windows/Foundation_Metadata"]

[profile.release]
opt-level = 3

[dependencies]
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
serde_json = "1"
