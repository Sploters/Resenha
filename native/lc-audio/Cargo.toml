[package]
name = "lc-audio"
version = "0.1.0"
edition = "2021"
description = "Resenha: áudio da transmissão só do jogo (WASAPI process loopback) e lista de janelas, inclusive minimizadas."
publish = false

[[bin]]
name = "lc-audio"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_Storage_FileSystem",
] }
windows-core = "0.62"

[dependencies]
serde_json = "1"
png = "0.17"
base64 = "0.22"

[profile.release]
opt-level = 3
